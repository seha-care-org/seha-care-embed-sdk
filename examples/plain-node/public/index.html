<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seha Care consultation</title>
    <style>
      body { margin: 0; padding: 0 1rem 3rem; font-family: system-ui, sans-serif; }
      main { width: min(100%, 66.25rem); margin: 3rem auto 0; }
      form { display: grid; gap: 1rem; max-width: 30rem; }
      input, button { padding: .75rem; font: inherit; }
      .consultation-frame-shell { container: consultation / inline-size; width: 100%; max-width: 66.25rem; margin: 1.5rem auto 0; }
      iframe { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; border: 0; border-radius: 1rem; }
      @container consultation (min-width: 48rem) { iframe { aspect-ratio: 4 / 3; border-radius: 1.25rem; } }
      iframe[hidden] { display: none; }
      [role="alert"] { color: #a52828; }
    </style>
  </head>
  <body>
    <main>
      <h1>Start a Seha Care consultation</h1>
      <form id="consultation-form">
        <label for="visitor">Visitor name (optional)</label>
        <input id="visitor" autocomplete="name" />
        <button type="submit">Start session</button>
        <p id="status" role="status" aria-live="polite"></p>
        <p id="error" role="alert" hidden></p>
      </form>
      <div class="consultation-frame-shell">
        <iframe id="consultation-frame" title="Seha Care consultation" allow="camera; microphone; autoplay" referrerpolicy="no-referrer" hidden></iframe>
      </div>
    </main>
    <script type="module">
      import { SehaCareEmbedClient } from "/sdk/client/index.js";

      const form = document.querySelector("#consultation-form");
      const button = form.querySelector("button");
      const identityInput = document.querySelector("#visitor");
      const status = document.querySelector("#status");
      const error = document.querySelector("#error");
      const frame = document.querySelector("#consultation-frame");
      const client = new SehaCareEmbedClient();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (button.disabled) return;
        button.disabled = true;
        error.hidden = true;
        status.textContent = "Creating your private session link…";
        try {
          const visitorName = identityInput.value.trim();
          const { sessionUrl } = await client.startSession(
            visitorName ? { userIdentity: visitorName } : {},
          );
          frame.src = sessionUrl;
          frame.hidden = false;
          form.hidden = true;
        } catch {
          status.textContent = "";
          error.textContent = "Could not start the session. Please try again.";
          error.hidden = false;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
