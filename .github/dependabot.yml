version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /
      - /examples/react-demo
      - /examples/nextjs-app
      - /examples/angular-nest/client
      - /examples/angular-nest/server
      - /examples/plain-node
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      angular:
        patterns: ["@angular/*", "ng-packagr"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
